services:
  db:
    image: postgres:18-alpine
    container_name: bookworm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookworm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookworm}
      POSTGRES_DB: ${POSTGRES_DB:-bookworm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookworm} -d ${POSTGRES_DB:-bookworm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
